name: Las medidas que nadie mira

#  LAS TRES QUE QUEDABAN FUERA, Y POR QUE TIENEN CASA PROPIA.
#
#  `banco.yml` corre en cada push las pruebas que devuelven codigo de salida y
#  no dependen del reloj, y deja fuera tres a proposito:
#
#    · `Tests/cpu.py` mide por RELOJ -pixeles repintados en ocho segundos- y
#      con la maquina ocupada no es una medida: compartiendo nucleos con las
#      1456 corridas de expo.py saco nueve fichas «repintandose solas» que
#      estaban perfectas.
#    · `Soak` es un millon de sesiones, 1897 s medidos.
#    · `Cpu` no juzga nada: publica una tabla por etapas, y lo que viaja es la
#      proporcion entre filas y nunca el valor.
#
#  Esa razon sigue siendo buena y no se toca. Lo que estaba mal es lo otro: que
#  las tres dependieran de que alguien se acordara. `FERIA-2026.md` §8.3 lo
#  llama por su nombre -«la lista de los que nadie mira sigue teniendo tres
#  entradas»- y esta casa ya lo ha pagado dos veces: `Tests/planos.py` llevo
#  TANDAS en rojo sin que nadie lo corriera, y el analizador del EQ repintaba
#  para siempre con `cpu.py` diciendo «1». Las dos las cazo alguien
#  ejecutandolo a mano.
#
#  Asi que corren aqui: en su propio job, con el runner PARA ELLAS SOLAS -que
#  es la condicion que las hacia salir de banco.yml- una vez al dia y a mano.
#  `Cpu` publica su tabla como artefacto porque no hay listón que aplicarle:
#  lo que se lee es una fila contra la de al lado.
on:
  schedule:
    #  De madrugada en UTC, que es cuando el runner esta mas ocioso: es la
    #  unica prueba de esta casa a la que eso le cambia el numero.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  JUCE_TAG: "8.0.15"

jobs:
  medidas:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de JUCE en Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libcurl4-openssl-dev libgl1-mesa-dev mesa-common-dev libglu1-mesa-dev \
            libwebkit2gtk-4.1-dev ninja-build xvfb x11-utils

      - name: Cache de JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ env.JUCE_TAG }}-${{ runner.os }}

      - name: Compilar la app y los tres bancos del motor
        run: |
          cmake -B build -G Ninja -DZATI_BENCH=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target Zati Soak Cpu -j"$(nproc)"

      - name: La pantalla virtual
        run: |
          Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
          for i in $(seq 1 30); do DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && break; sleep 1; done
          DISPLAY=:99 xdpyinfo >/dev/null

      #  UNA DETRAS DE OTRA Y NUNCA EN PARALELO. Es la regla entera de este
      #  fichero: dos de estas a la vez se miden la una a la otra.
      - name: Lo que la cara repinta
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/cpu.py

      #  `Soak` no juzga por liston sino por lo unico que no puede pasar nunca
      #  -NaN, salida fuera de rango, voz colgada tras el panico- y devuelve
      #  codigo. Doscientas mil y no un millon: el millon son 1897 s y esto
      #  corre todos los dias.
      - name: Mucha gente
        if: '!cancelled()'
        run: ./build/Soak_artefacts/Release/Soak 200000

      #  Y LA TABLA DEL MOTOR, que se PUBLICA y no se juzga: su propio
      #  comentario dice que lo que viaja es la proporcion entre filas y nunca
      #  el valor, asi que ponerle un liston seria inventarle una poblacion.
      - name: La tabla por etapas
        if: '!cancelled()'
        run: ./build/Cpu_artefacts/Release/Cpu | tee cpu-etapas.txt

      - name: Guardar la tabla
        if: '!cancelled()'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpu-etapas
          path: cpu-etapas.txt
          retention-days: 14
