name: Build Android APK

# Builds the native JUCE app into an Android APK.
#
# JUCE's CMake API does NOT support Android ("Android targets are not currently
# supported"), so the only supported path is: build the Projucer, have it
# generate an Android Gradle project from ARTiFACTS.jucer, then Gradle-build it.
# JUCE is pinned to the same tag as the desktop CMake build (8.0.4). Oboe
# (bundled in JUCE) is enabled for the low-latency audio path.

on:
  workflow_dispatch:
  push:
    branches: [ claude/new-session-bgeba4 ]
    paths:
      - 'Source/**'
      - 'ARTiFACTS.jucer'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

env:
  JUCE_TAG: "8.0.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Projucer build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxcomposite-dev \
            libcurl4-openssl-dev libgl1-mesa-dev mesa-common-dev libglu1-mesa-dev \
            libwebkit2gtk-4.1-dev ninja-build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (NDK, cmake, platform)
        run: |
          # NDK + CMake versions MUST match what Projucer writes into the
          # generated app/build.gradle for JUCE 8.0.4 (ndkVersion 26.2.11394342,
          # cmake 3.22.1). If a JUCE bump changes these, update them here too.
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Checkout JUCE ${{ env.JUCE_TAG }}
        run: git clone --depth 1 --branch "${JUCE_TAG}" https://github.com/juce-framework/JUCE.git JUCE

      - name: Build Projucer
        run: |
          cmake -B JUCE/cmake-build -S JUCE -DJUCE_BUILD_EXTRAS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build JUCE/cmake-build --target Projucer -j"$(nproc)"

      - name: Generate Android project from ARTiFACTS.jucer
        run: |
          PROJUCER="$(find JUCE/cmake-build -name Projucer -type f -executable | head -1)"
          echo "Using Projucer: $PROJUCER"
          "$PROJUCER" --resave ARTiFACTS.jucer

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > Builds/Android/local.properties

      - name: Create Android debug keystore
        # Projucer's generated 'juceSigning' config points at the standard debug
        # keystore (~/.android/debug.keystore, storepass/keypass "android", alias
        # androiddebugkey). A fresh runner has none, so generate the canonical one.
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -storetype JKS
          fi

      - name: Build debug APK
        working-directory: Builds/Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        id: apk
        run: |
          APK="$(find Builds/Android -name '*-debug.apk' | head -1)"
          test -n "$APK" || { echo "No APK produced"; exit 1; }
          cp "$APK" ARTiFACTS-debug.apk
          echo "Built: $APK"

      - uses: actions/upload-artifact@v4
        with:
          name: ARTiFACTS-apk
          path: ARTiFACTS-debug.apk
          if-no-files-found: error

      # Optional: also attach the APK to a rolling release tag for easy phone download.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest ARTiFACTS debug APK
          files: ARTiFACTS-debug.apk
          make_latest: false

  # Optional, best-effort: boot an x86_64 emulator and confirm the app launches
  # without crashing. Never fails the APK build (continue-on-error) — it only
  # produces a screenshot + a pass/fail signal. The app builds an x86_64 ABI,
  # so it can run on the emulator even though the phone target is arm64.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ARTiFACTS-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r ARTiFACTS-debug.apk
            adb shell am start -n com.artifacts.fx404/com.rmsl.juce.JuceActivity
            sleep 12
            adb exec-out screencap -p > screenshot.png
            if adb logcat -d | grep -q 'FATAL EXCEPTION'; then
              echo "App crashed on launch"; adb logcat -d | tail -60; exit 1
            fi
            adb shell dumpsys activity activities | grep -q 'com.artifacts.fx404' || {
              echo "Activity not running"; exit 1; }
            echo "Launched OK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: screenshot.png
          if-no-files-found: warn
