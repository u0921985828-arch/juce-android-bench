name: Build Android APK

# Builds the native JUCE app (Shard, by ARTiFACTS) into an Android APK.
#
# JUCE's CMake API does NOT support Android ("Android targets are not currently
# supported"), so the only supported path is: build the Projucer, have it
# generate an Android Gradle project from Shard.jucer, then Gradle-build it.
# JUCE is pinned to the same tag as the desktop CMake build (8.0.4). Oboe
# (bundled in JUCE) is enabled for the low-latency audio path.

on:
  workflow_dispatch:   # APK builds are MANUAL ONLY (run from the Actions tab / on request)

permissions:
  contents: write

env:
  JUCE_TAG: "8.0.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Projucer build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxcomposite-dev \
            libcurl4-openssl-dev libgl1-mesa-dev mesa-common-dev libglu1-mesa-dev \
            libwebkit2gtk-4.1-dev ninja-build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (NDK, cmake, platform)
        run: |
          # NDK + CMake versions MUST match what Projucer writes into the
          # generated app/build.gradle for JUCE 8.0.4 (ndkVersion 26.2.11394342,
          # cmake 3.22.1). If a JUCE bump changes these, update them here too.
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Checkout JUCE ${{ env.JUCE_TAG }}
        run: git clone --depth 1 --branch "${JUCE_TAG}" https://github.com/juce-framework/JUCE.git JUCE

      - name: Build Projucer
        run: |
          cmake -B JUCE/cmake-build -S JUCE -DJUCE_BUILD_EXTRAS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build JUCE/cmake-build --target Projucer -j"$(nproc)"

      - name: Stamp a monotonic versionCode
        # Android only treats a build as an upgrade when versionCode increases.
        # The workflow run number is monotonic, so use it directly.
        run: |
          python3 - "$GITHUB_RUN_NUMBER" <<'PY'
          import re, sys
          code = sys.argv[1]
          p = "Shard.jucer"
          s = open(p, encoding="utf-8").read()
          if re.search(r'androidVersionCode="[^"]*"', s):
              s = re.sub(r'androidVersionCode="[^"]*"', f'androidVersionCode="{code}"', s, count=1)
          else:
              s = re.sub(r'(<ANDROIDSTUDIO\b)', rf'\1 androidVersionCode="{code}"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          print("androidVersionCode =", code)
          PY

      - name: Generate Android project from Shard.jucer
        run: |
          PROJUCER="$(find JUCE/cmake-build -name Projucer -type f -executable | head -1)"
          echo "Using Projucer: $PROJUCER"
          "$PROJUCER" --resave Shard.jucer

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > Builds/Android/local.properties

      - name: Install the repo's debug keystore
        # MUST be the same key on every run. Generating one per build (what this
        # step used to do) gave every APK a different signing certificate, and
        # Android refuses to update an installed app whose signature changed —
        # you had to uninstall before each new build. ci/colors-debug.keystore is
        # a DEBUG key (password "android", the canonical Android debug password);
        # it is not a Play Store upload key and must never become one.
        run: |
          mkdir -p "$HOME/.android"
          cp ci/colors-debug.keystore "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
                  -storepass android -alias androiddebugkey

      - name: Build APKs (debug + release)
        working-directory: Builds/Android
        # Release is the optimised (-O3) build — better DSP performance and the
        # representative latency for the P0 gate. Both are signed with the debug
        # keystore (juceSigning), so both sideload fine for testing. Release is
        # NOT Play-Store-ready (would need a real upload key) — that's later.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          DBG="$(find Builds/Android -name '*-debug.apk' | head -1)"
          REL="$(find Builds/Android -name '*-release.apk' | head -1)"
          test -n "$DBG" || { echo "No debug APK produced";   exit 1; }
          test -n "$REL" || { echo "No release APK produced"; exit 1; }
          cp "$DBG" Shard-debug.apk
          cp "$REL" Shard-release.apk
          echo "Debug:   $DBG"
          echo "Release: $REL"
          ls -la Shard-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Shard-apk
          path: |
            Shard-debug.apk
            Shard-release.apk
          if-no-files-found: error

      # Also attach both APKs to a rolling release tag for easy phone download.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest Shard APKs (debug + release)
          files: |
            Shard-debug.apk
            Shard-release.apk
          make_latest: false

  # NOTE: the emulator smoke-test job was removed because the APK is now built
  # for arm64-v8a only (the phone target), and GitHub's runners are x86_64 — the
  # emulator could no longer install an arm64-only APK. A prior run already
  # confirmed Shard installs and launches without crashing. To re-enable it,
  # temporarily add "x86_64" back to androidArchitectures in Shard.jucer.
