name: Build Android APK

# Builds the native JUCE app (Zati, by ARTiFACTS) into an Android APK.
#
# JUCE's CMake API does NOT support Android ("Android targets are not currently
# supported"), so the only supported path is: build the Projucer, have it
# generate an Android Gradle project from Zati.jucer, then Gradle-build it.
# JUCE is pinned to the same tag as the desktop CMake build (8.0.4). Oboe
# (bundled in JUCE) is enabled for the low-latency audio path.

on:
  workflow_dispatch:   # APK builds are MANUAL ONLY (run from the Actions tab / on request)

permissions:
  contents: write

env:
  JUCE_TAG: "8.0.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Projucer build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxcomposite-dev \
            libcurl4-openssl-dev libgl1-mesa-dev mesa-common-dev libglu1-mesa-dev \
            libwebkit2gtk-4.1-dev ninja-build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (NDK, cmake, platform)
        run: |
          # NDK + CMake versions MUST match what Projucer writes into the
          # generated app/build.gradle for JUCE 8.0.4 (ndkVersion 26.2.11394342,
          # cmake 3.22.1). If a JUCE bump changes these, update them here too.
          #
          #  La plataforma es 36 porque Play EXIGE que una app nueva apunte a
          #  Android 16, y compileSdk sigue a targetSdk. Estaba en 35, que era
          #  correcto cuando se escribio y dejo de serlo sin que nadie tocara
          #  nada: la subida se rechaza. Por eso Zati.jucer pasa a AGP 8.9.1 /
          #  Gradle 8.11.1, que es el par mas antiguo que acepta compileSdk 36 -
          #  AGP 8.6.1 ni lo reconoce.
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Checkout JUCE ${{ env.JUCE_TAG }}
        run: git clone --depth 1 --branch "${JUCE_TAG}" https://github.com/juce-framework/JUCE.git JUCE

      - name: Let the app choose its Oboe stream configuration
        # JUCE hardcodes the usage and sample format of the Android output
        # stream, and both decide whether Android grants the stream MMAP.
        # The patch makes JUCE read two globals the app sets from its startup
        # probe. It exits non-zero if JUCE's source moved, so a silently
        # unpatched build cannot ship.
        run: python3 ci/patch_juce_oboe.py

      - name: Build Projucer
        run: |
          cmake -B JUCE/cmake-build -S JUCE -DJUCE_BUILD_EXTRAS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build JUCE/cmake-build --target Projucer -j"$(nproc)"

      - name: Stamp a monotonic versionCode
        # Android only treats a build as an upgrade when versionCode increases.
        # The workflow run number is monotonic, so use it directly.
        run: |
          python3 - "$GITHUB_RUN_NUMBER" <<'PY'
          import re, sys
          code = sys.argv[1]
          p = "Zati.jucer"
          s = open(p, encoding="utf-8").read()
          if re.search(r'androidVersionCode="[^"]*"', s):
              s = re.sub(r'androidVersionCode="[^"]*"', f'androidVersionCode="{code}"', s, count=1)
          else:
              s = re.sub(r'(<ANDROIDSTUDIO\b)', rf'\1 androidVersionCode="{code}"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          print("androidVersionCode =", code)
          PY

      - name: Generate Android project from Zati.jucer
        run: |
          PROJUCER="$(find JUCE/cmake-build -name Projucer -type f -executable | head -1)"
          echo "Using Projucer: $PROJUCER"
          "$PROJUCER" --resave Zati.jucer

      #  The launch window. Until JUCE puts up its first frame the window is
      #  whatever the theme's windowBackground says, and Theme.Material.Light
      #  says WHITE - so the app opened onto a second and a half of blank white
      #  before the face appeared, which reads as a hang and not as a load. A
      #  theme whose background is the chassis colour makes that same second
      #  and a half look like the machine already being there.
      #
      #  Projucer writes res/values/string.xml but never a styles.xml, so this
      #  goes in after the resave and before Gradle.
      #  Y EL COLOR SE LEE DE LA TABLA, no se copia aqui.
      #
      #  Estaba escrito a mano - #FFF4EFE3 - o sea el chasis de PAPEL copiado
      #  en un YAML, desacoplado de ZatiColours::skinTable. Retocar la paleta
      #  en C++ dejaba la pantalla de arranque en el color viejo y nada avisaba:
      #  es exactamente el fallo que Tests/skins.py existe para no tener, solo
      #  que fuera del alcance de skins.py. Se lee del fichero, con el mismo
      #  cuidado que alli - sin comentarios, porque la tabla cita colores
      #  dentro de las frases - y si no se puede leer, el paso FALLA en vez de
      #  colar un color inventado.
      - name: Launch theme (chassis-coloured window background)
        run: |
          set -euo pipefail
          HEX="$(python3 - <<'PY'
          import re, sys
          s = open('Source/ZatiLookAndFeel.h', encoding='utf8').read()
          s = re.sub(r'//[^\n]*', '', s)
          blk = s[s.index('static const Skin table[4]'):]
          m = re.findall(r'0x([0-9a-fA-F]{8})', blk)
          if not m: sys.exit('no se pudo leer chassisTop de la tabla de carcasas')
          print('#FF%06X' % (int(m[0], 16) & 0xffffff))
          PY
          )"
          echo "chasis de arranque: $HEX"
          for d in main debug release; do
            mkdir -p "Builds/Android/app/src/$d/res/values"
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<resources>' \
              "  <color name=\"zatiChassis\">$HEX</color>" \
              '  <style name="ZatiLaunch" parent="@android:style/Theme.Material.Light.NoActionBar">' \
              '    <item name="android:windowBackground">@color/zatiChassis</item>' \
              '  </style>' \
              '</resources>' \
              > "Builds/Android/app/src/$d/res/values/zati_theme.xml"
          done
          cat Builds/Android/app/src/main/res/values/zati_theme.xml
          grep -n 'android:theme' Builds/Android/app/src/main/AndroidManifest.xml

      - name: La app se llama Zati Sampler
        run: |
          set -euo pipefail
          #  EL NOMBRE QUE SE VE, que no es el mismo que el del proyecto.
          #
          #  El proyecto se llama Zati y el identificador es com.artifacts.zati:
          #  el primero da nombre a los modulos de Gradle y a las rutas que este
          #  workflow busca a mano, y el segundo ES la app para Android -
          #  cambiarlo seria otra aplicacion distinta, sin actualizacion posible
          #  desde esta. El rotulo que se lee debajo del icono es otra cosa, y
          #  es el unico que tiene que decir "Zati Sampler".
          #
          #  Y se llama Zati Sampler, no ARTiFACTS ZATI. Estuvo una corrida
          #  puesto lo segundo por leer una pregunta como una correccion; el
          #  estudio es ARTiFACTS y firma la app, pero el nombre de la app es
          #  Zati Sampler y no lo decide esto.
          set -x
          find Builds/Android/app/src -name 'string*.xml' | while read -r f; do
            python3 - "$f" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'(<string name="app_name">)[^<]*(</string>)', r'\1Zati Sampler\2', s)
          open(p, "w", encoding="utf-8").write(s)
          PY
          done
          grep -rn 'app_name' Builds/Android/app/src --include=*.xml | head

      - name: Sin copia de seguridad automatica
        run: |
          set -euo pipefail
          #  allowBackup no estaba declarado, y sin declarar VALE TRUE. Para
          #  esta app eso es todo riesgo y ningun beneficio: la copia
          #  automatica de Android se rinde a los 25 MB por aplicacion, y aqui
          #  una sola sesion con cuatro breaks ya los pasa - o sea que nunca
          #  iba a salvar el trabajo de nadie -, mientras que deja las
          #  muestras y los proyectos de la persona en un sitio del que se
          #  pueden sacar. Se declara que no, y se declara a proposito.
          M=Builds/Android/app/src/main/AndroidManifest.xml
          python3 - "$M" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          if 'android:allowBackup' not in s:
              s = re.sub(r'(<application\b)', r'\1 android:allowBackup="false"', s, count=1)
              open(p, "w", encoding="utf-8").write(s)
          PY
          grep -n 'allowBackup' "$M"

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > Builds/Android/local.properties

      - name: Install the repo's debug keystore
        # MUST be the same key on every run. Generating one per build (what this
        # step used to do) gave every APK a different signing certificate, and
        # Android refuses to update an installed app whose signature changed —
        # you had to uninstall before each new build. ci/zati-debug.keystore is
        # a DEBUG key (password "android", the canonical Android debug password);
        # it is not a Play Store upload key and must never become one.
        run: |
          mkdir -p "$HOME/.android"
          cp ci/zati-debug.keystore "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
                  -storepass android -alias androiddebugkey

      - name: Build APKs (debug + release) and the release AAB
        working-directory: Builds/Android
        # Release is the optimised (-O3) build — better DSP performance and the
        # representative latency for the P0 gate. Both are signed with the debug
        # keystore (juceSigning), so both sideload fine for testing. Release is
        # NOT Play-Store-ready (would need a real upload key) — that's later.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Collect APKs and the AAB
        # Play requires an App Bundle for new apps; the APKs stay because they
        # are what actually gets sideloaded onto the test phone, and because a
        # bundle cannot be installed by tapping it.
        run: |
          DBG="$(find Builds/Android -name '*-debug.apk' | head -1)"
          REL="$(find Builds/Android -name '*-release.apk' | head -1)"
          AAB="$(find Builds/Android -name '*-release.aab' | head -1)"
          test -n "$DBG" || { echo "No debug APK produced";   exit 1; }
          test -n "$REL" || { echo "No release APK produced"; exit 1; }
          test -n "$AAB" || { echo "No release AAB produced"; exit 1; }
          cp "$DBG" Zati-debug.apk
          cp "$REL" Zati-release.apk
          cp "$AAB" Zati-release.aab
          echo "Debug:   $DBG"
          echo "Release: $REL"
          echo "Bundle:  $AAB"
          ls -la Zati-*.apk Zati-*.aab

      - name: Paginas de 16 KB, comprobadas y no supuestas
        #  Play BLOQUEA desde el 31 de mayo de 2026 cualquier app con codigo
        #  nativo cuyas librerias no esten alineadas a 16384 bytes: los moviles
        #  nuevos ya arrancan con paginas de 16 KB y una .so alineada a 4 KB no
        #  carga. Zati.jucer lleva los flags del enlazador desde hace tiempo
        #  (-Wl,-z,max-page-size=16384) y de hecho FUNCIONAN - medido, los tres
        #  segmentos LOAD salen con align 0x4000.
        #
        #  Pero eso es una bandera en un fichero de proyecto y un dia alguien
        #  regenera el exportador y se la lleva por delante, y el sintoma no es
        #  un error de compilacion: es una subida rechazada meses despues, o
        #  peor, una app que no abre en un movil nuevo. Se comprueba en el
        #  binario que se va a publicar, que es el unico sitio donde la
        #  respuesta es verdad.
        run: |
          set -euo pipefail
          READELF="$(find "$ANDROID_SDK_ROOT/ndk" -name 'llvm-readelf' | head -1)"
          test -n "$READELF" || READELF=readelf
          rm -rf .so-check && mkdir .so-check
          unzip -q -o Zati-release.apk 'lib/*' -d .so-check
          bad=0
          for f in $(find .so-check -name '*.so'); do
            for a in $("$READELF" -lW "$f" | awk '/LOAD/{print $NF}'); do
              echo "$f  LOAD align $a"
              [ "$a" = "0x4000" ] || { echo "   ^ NO son 16 KB"; bad=1; }
            done
          done
          rm -rf .so-check
          [ "$bad" = "0" ] || { echo "Hay librerias sin alinear a 16 KB: Play lo rechaza."; exit 1; }
          echo "todas las librerias alineadas a 16 KB"

      - name: Re-sign the release APK with the upload key
        # Only when the four secrets exist. Gradle has already signed both APKs
        # with the debug key (JUCE's juceSigning), which is fine for sideload
        # and rejected by Play; apksigner replaces that signature with the real
        # upload one in place. Without the secrets this step does nothing and
        # the release APK stays exactly as before, so the phone-testing loop is
        # never blocked on having a keystore.
        env:
          KS_B64:   ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS:  ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "No upload keystore configured - the release APK keeps the debug signature."
            echo "It can be sideloaded, but Google Play will reject it. See GOOGLE-PLAY.md."
            exit 0
          fi

          echo "$KS_B64" | base64 -d > upload.jks
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)"
          "$APKSIGNER" sign \
            --ks upload.jks \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            Zati-release.apk
          "$APKSIGNER" verify --print-certs Zati-release.apk

          #  Y SE COMPRUEBA QUE LA DE DEPURACION NO SE QUEDO PUESTA.
          #
          #  ci/zati-debug.keystore esta en el repositorio a proposito - es lo
          #  que hace que el telefono acepte actualizar entre corridas en vez
          #  de pedir desinstalar - y su contrasena es la canonica de Android.
          #  Eso vale para el bucle de pruebas y no puede valer para nada mas:
          #  un APK publicable firmado con una clave que esta en el repositorio
          #  es cualquiera pudiendo publicar una actualizacion de esta app.
          #
          #  Se compara la HUELLA del certificado del repositorio contra la del
          #  APK, no un nombre. Esto buscaba 'CN=Android Debug' y el certificado
          #  del repositorio dice 'CN=ARTiFACTS COLORS Debug' - el nombre que le
          #  quedo de otro proyecto - asi que la comprobacion no podia saltar
          #  nunca: una barrera que no cubre el unico caso para el que se
          #  escribio. La huella no se queda vieja cuando alguien renombre algo.
          REPO_FP="$(keytool -list -v -keystore ci/zati-debug.keystore \
                             -storepass android -alias androiddebugkey \
                     | grep -i 'SHA256:' | head -1 | tr -d ' ' | cut -d: -f2-)"
          APK_FP="$("$APKSIGNER" verify --print-certs Zati-release.apk \
                    | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')"
          #  keytool imprime AA:BB:.. y apksigner aabb.., asi que se comparan
          #  en minusculas y sin los dos puntos o no coincidirian jamas - que
          #  es otra forma de tener una barrera que siempre dice que si.
          REPO_FP="$(echo "$REPO_FP" | tr -d ':' | tr 'A-Z' 'a-z')"
          APK_FP="$(echo "$APK_FP" | tr -d ':' | tr 'A-Z' 'a-z')"
          test -n "$REPO_FP" -a -n "$APK_FP" || { echo "No se pudo leer una de las dos huellas"; exit 1; }
          echo "huella repositorio $REPO_FP"
          echo "huella APK         $APK_FP"
          if [ "$REPO_FP" = "$APK_FP" ]; then
            echo "La release quedo firmada con la clave de depuracion del repositorio."
            exit 1
          fi

          # The bundle is signed with jarsigner, not apksigner: an AAB is a jar,
          # and apksigner only knows how to sign APKs. Play re-signs it with the
          # app signing key anyway - this signature is what proves the upload
          # came from you.
          "$JAVA_HOME/bin/jarsigner" -verbose:false \
            -keystore upload.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            Zati-release.aab "$KEY_ALIAS"
          rm -f upload.jks
          echo "Release APK and AAB signed with the upload key."

      - uses: actions/upload-artifact@v4
        with:
          name: Zati-apk
          path: |
            Zati-debug.apk
            Zati-release.apk
            Zati-release.aab
          if-no-files-found: error

      # Also attach both APKs to a rolling release tag for easy phone download.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest Zati builds (APK debug + release, AAB for Play)
          files: |
            Zati-debug.apk
            Zati-release.apk
            Zati-release.aab
          make_latest: false

  # NOTE: the emulator smoke-test job was removed because the APK is now built
  # for arm64-v8a only (the phone target), and GitHub's runners are x86_64 — the
  # emulator could no longer install an arm64-only APK. A prior run already
  # confirmed Zati installs and launches without crashing. To re-enable it,
  # temporarily add "x86_64" back to androidArchitectures in Zati.jucer.
