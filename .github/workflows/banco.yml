name: El banco

#  NADA SE ENTREGA SIN MEDIRLO — Y HASTA HOY LO MEDIA UNA PERSONA ACORDANDOSE.
#
#  Este proyecto tiene veintitantas pruebas propias y su regla de cabecera es
#  que ninguna entrega sale sin ellas. Corrian todas a mano: el unico workflow
#  que habia era el de la APK, manual, y de todo el banco solo ejecutaba
#  `Tests/apk.py`. O sea que una regresion en expo.py, instr.py, kits.py o el
#  motor llegaba a una APK con solo olvidarse de correr el banco una vez.
#
#  Aqui corren las que devuelven codigo de salida y no dependen del reloj:
#  `Tests/cpu.py` se queda fuera a proposito -mide por RELOJ y este fichero ya
#  tiene escrito que con la maquina ocupada no es una medida- y `Tests/expo.py`
#  entra en su modo paralelo, que son ~2 min y no cuarenta.
#
#  Y las tres que no caben aqui —`cpu.py`, `Soak` y `Cpu`— ya no dependen de
#  que alguien se acuerde: viven en `medidas.yml`, con el runner para ellas
#  solas y una vez al dia. La razon por la que estaban fuera se conserva; lo
#  que se arregla es que no las mirara nadie.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  JUCE_TAG: "8.0.15"

jobs:
  banco:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de JUCE en Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libcurl4-openssl-dev libgl1-mesa-dev mesa-common-dev libglu1-mesa-dev \
            libwebkit2gtk-4.1-dev ninja-build xvfb x11-utils imagemagick

      #  LAS FUENTES, QUE NO SON UN ADORNO: este banco mide ANCHOS DE TEXTO
      #  -TRUNC, SQUEEZE y CORTADO- asi que sin las mismas caras instaladas la
      #  misma app da otro veredicto. La primera corrida en el repositorio
      #  nuevo lo cazo: `FALLA CORTADO 3` con la app intacta y el mismo commit
      #  que aqui da CORTADO 0, y de paso los iconos dibujados en 280x653
      #  saltaron del 34% al 48% -otra cara, otras metricas, otro reparto-.
      #  `wqy-zenhei` es el chino y `ipafont-gothic` el japones; sin ellas el
      #  runner cae en Unifont y mide otra cosa. Es *un veredicto que depende
      #  de la maquina no es un veredicto*, que esta casa ya pago dos veces con
      #  el reloj, aplicado a la tipografia.
      - name: Las mismas fuentes que la maquina de trabajo
        run: |
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core fonts-dejavu-mono fonts-freefont-ttf \
            fonts-liberation fonts-ipafont-gothic fonts-wqy-zenhei \
            fonts-unifont fonts-noto-color-emoji fonts-tlwg-loma-otf
          fc-cache -f
          fc-list | wc -l

      #  El arbol de JUCE se cachea por su tag: sin esto cada corrida se baja y
      #  compila el mismo 8.0.15, que es la mayor parte del reloj de este job.
      #  El tag va aqui Y en CMakeLists.txt, y quien resuelve de verdad es el
      #  segundo: si divergieran, la cache traeria un arbol y CMake se bajaria
      #  otro encima.
      - name: Cache de JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ env.JUCE_TAG }}-${{ runner.os }}

      - name: Compilar la app y los bancos del motor
        run: |
          cmake -B build -G Ninja -DZATI_BENCH=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target Zati StressTest -j"$(nproc)"

      #  Sin pantalla virtual JUCE se cae en Component::centreWithSize y parece
      #  un fallo del codigo. Ver .claude/skills/banco/SKILL.md.
      - name: La pantalla virtual
        run: |
          Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
          for i in $(seq 1 30); do DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && break; sleep 1; done
          DISPLAY=:99 xdpyinfo >/dev/null

      #  Las que NO dependen de la pantalla: la tabla de idiomas, las cuatro
      #  carcasas y las dos listas de fuentes.
      #
      #  Y con `!cancelled()` como todas las de abajo, que es lo que el parrafo
      #  siguiente ya dice y aqui no se habia aplicado: en la primera corrida
      #  de este fichero el paso de la pantalla virtual fallo y estas DOS
      #  -las unicas que no necesitan pantalla- salieron `skipped`. Un paso
      #  saltado no es un paso verde, y el informe decia una cosa donde habia
      #  cinco.
      - name: Tabla, carcasas, fuentes y marcas
        if: '!cancelled()'
        run: |
          python3 Tests/lang.py
          python3 Tests/skins.py
          python3 Tests/fuentes.py
          python3 Tests/marcas.py

      #  Y el aire de maquetado, que tampoco necesita pantalla: lee la tabla de
      #  `Metrics` del propio fuente y barre los ficheros que maquetan. Cuesta
      #  menos de un segundo y caza lo que ninguna de las catorce reglas de
      #  `expo.py` puede ver: un margen escrito a mano no solapa, no se sale, no
      #  corta un rotulo y no mide cero.
      - name: El aire de maquetado
        if: '!cancelled()'
        run: python3 Tests/maqueta.py

      - name: El motor
        if: '!cancelled()'
        run: ./build/StressTest_artefacts/Release/StressTest

      #  Cada una por separado y no encadenadas con &&: encadenadas, la primera
      #  que falla esconde a las cuatro siguientes y el informe dice una cosa
      #  donde hay cinco.
      - name: El arranque
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/arranque.py
      #  Y QUE SE VEA IGUAL A 60 QUE A 120. Es determinista -no mide por
      #  reloj, mide milisegundos SIMULADOS a traves del codigo de verdad-
      #  asi que entra aqui y no se queda fuera con `cpu.py`.
      - name: La balistica, a 60 y a 120 Hz
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/fps.py
      - name: El tour
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/tour.py
      - name: Las herramientas de arreglo
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/arr.py
      - name: El piano
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/piano.py
      - name: La banda de audio de la cancion
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/clips.py
      - name: Las seis ranuras de efectos
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/ranuras.py
      - name: Los dieciseis canales de la mesa
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/canales.py
      - name: La cuenta atras y el metronomo
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/cuenta.py
      - name: El banco de tomas
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/tomas.py
      - name: El visor del plato y la familia de un efecto
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/rack.py
      - name: Los modos armados y el lienzo que los dice
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/modos.py
      - name: El EQ de cinco bandas y su curva
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/eq.py
      - name: La familia de dinamica
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/dinamica.py
      - name: La automatizacion
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/auto.py
      - name: Los paneles
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/paneles.py
      - name: El icono
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/icono.py

      #  Y LAS TRECE QUE ESTE FICHERO DECIA CORRER Y NO CORRIA. La cabecera
      #  promete «las que devuelven codigo de salida y no dependen del reloj»
      #  y la primera version ejecutaba diez de las veintitres que nombra la
      #  tabla de `.claude/skills/banco/SKILL.md`. O sea que la fabrica, la
      #  sesion, los instrumentos, la exportacion, los kits y el proyecto
      #  nuevo seguian dependiendo de que alguien se acordara, que es
      #  exactamente lo que este workflow existe para arreglar.
      #
      #  Medidas antes de meterlas, que un paso que tarda es un paso que
      #  alguien acaba quitando: kits 5s, nuevo 1, kit 1, export 1, dlc 2,
      #  instr 32, iconos 2, session 20, plano 16, store 36, niveles 1,
      #  clon 9, analiza 11 — **137 s las trece**, contra los 8 min 21 que
      #  cuesta compilar. `cpu.py` sigue fuera, que mide por RELOJ, y `Soak`
      #  tambien: un millon de sesiones son 2144 s.
      - name: Los sonidos de fabrica
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/kits.py
      - name: Que es cada sonido de fabrica
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/analiza.py
      - name: Con que abre la maquina
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/nuevo.py
      #  Lo que cada pantalla pide, y lo unico que juzga: que la maquina suene
      #  al primer toque con la bienvenida delante.
      - name: Lo que pide cada pantalla, y el primer sonido
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/carga.py
      - name: Que la sesion vuelva entera
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/session.py
      - name: Guardar y cargar un kit
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/kit.py
      - name: La exportacion
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/export.py
      - name: Los instrumentos, los packs y el candado
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/dlc.py
      - name: Los doscientos cincuenta y seis instrumentos
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/instr.py
      - name: Los dieciseis niveles
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/niveles.py
      - name: El juego de iconos
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/iconos.py
      - name: El plano de cada pantalla
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/plano.py
      #  Y LAS 39 PANTALLAS DIBUJADAS, que es OTRA prueba y no la de arriba:
      #  `plano.py` mira si una ficha tiene titulo y `planos.py` mira las FILAS
      #  -que ninguna salga con unas tapas dibujadas y otras no-. No estaba
      #  aqui, asi que sus siete huecos llevaban tandas en rojo sin que nada
      #  fallara: *un numero que nadie mira se publica*.
      - name: Los planos de cada pantalla
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/planos.py
      - name: Las fotos de la ficha de Play
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/store.py
      #  Y LAS TRES PALABRAS GRABADAS DE LA CARA, medidas en la FOTO: la app
      #  dice donde dibujo el rayado y los pixeles dicen donde esta el hueco.
      #  Catorce corridas -siete pantallas por dos, dump y foto, que son
      #  excluyentes en el mismo arranque-.
      - name: Las costuras de la cara
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/costuras.py

      #  El grande, y el ultimo: 1036 corridas. En paralelo son ~2 min.
      - name: La maqueta, en las siete pantallas y los cuatro idiomas
        if: '!cancelled()'
        run: DISPLAY=:99 python3 Tests/expo.py
